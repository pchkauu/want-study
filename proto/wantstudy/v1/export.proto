syntax = "proto3";

package wantstudy.v1;

option go_package = "github.com/pchkauu/want-study/service/api/internal/proto/wantstudy/v1;wantstudyv1";

service ExportService {
  rpc RenderStudyExport(RenderStudyExportRequest) returns (stream ExportChunk);
}

message RenderStudyExportRequest {
  string study_id = 1;
  optional int64 expected_content_revision = 2;
}

message ExportHeader {
  string study_id = 1;
  int64 study_revision = 2;
  int64 total_bytes = 3;
  int32 file_count = 4;
}

message ExportFile {
  string path = 1;
  bytes content = 2;
  string sha256 = 3;
}

message ExportChunk {
  oneof value {
    ExportHeader header = 1;
    ExportFile file = 2;
  }
}
