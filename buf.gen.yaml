version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: service/api/internal/proto
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: service/api/internal/proto
    opt: paths=source_relative
  - local: protoc-gen-dart
    out: app/desktop/lib/src/proto
    opt: grpc
inputs:
  - directory: proto
